name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read project version
        id: version
        shell: bash
        run: |
          version="$(./gradlew properties --quiet | sed -n 's/^version: //p')"
          if [[ -z "$version" || "$version" == "unspecified" ]]; then
            echo "Unable to determine the project version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build package artifacts
        run: ./gradlew build --no-daemon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      - name: Trigger and verify JitPack release
        timeout-minutes: 15
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          pom_url="https://jitpack.io/com/github/${repository_owner}/${repository_name}/${RELEASE_TAG}/${repository_name}-${RELEASE_TAG}.pom"

          for attempt in {1..10}; do
            echo "Requesting JitPack artifact (attempt ${attempt}/10): ${pom_url}"
            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              --output /dev/null \
              "$pom_url"; then
              echo "JitPack release ${RELEASE_TAG} is available."
              exit 0
            fi

            if (( attempt < 10 )); then
              sleep 15
            fi
          done

          echo "JitPack did not publish ${RELEASE_TAG} within the allowed time." >&2
          echo "Build log: https://jitpack.io/com/github/${repository_owner}/${repository_name}/${RELEASE_TAG}/build.log" >&2
          exit 1
